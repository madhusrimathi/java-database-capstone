<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Smart Clinic</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937}
header{background:#2563eb;color:white;padding:22px 40px;font-size:22px;font-weight:bold}
main{max-width:1100px;margin:45px auto;padding:0 25px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
button{background:#2563eb;color:white;border:0;border-radius:8px;padding:13px 22px;font-size:16px;cursor:pointer}
.panel{background:white;padding:30px;border-radius:14px;box-shadow:0 5px 20px rgba(0,0,0,.08)}
h1,h2{margin-top:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
label{display:block;font-weight:600;margin-bottom:7px}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:7px;font-size:15px}
.actions{margin-top:25px;text-align:right}
.badge{display:inline-block;background:#dcfce7;color:#166534;padding:7px 12px;border-radius:20px;font-size:14px}
</style>
</head>
<body>
<header>Smart Clinic Management System — Admin Portal</header>
<main>
<div class="top">
<div>
<h1>Admin Dashboard</h1>
<p>Manage doctors and clinic information.</p>
</div>
<span class="badge">Administrator</span>
</div>

<div class="panel">
<h2>Add New Doctor</h2>
<p>Enter the doctor's information below to add them to the Smart Clinic system.</p>

<div class="form-grid">
<div>
<label>Doctor Name</label>
<input value="Dr. Priya Nair">
</div>
<div>
<label>Specialty</label>
<select><option>Cardiology</option></select>
</div>
<div>
<label>Email</label>
<input value="priya.nair@smartclinic.com">
</div>
<div>
<label>Phone Number</label>
<input value="98765432">
</div>
<div>
<label>Available Time</label>
<select><option>09:00 AM</option></select>
</div>
<div>
<label>Password</label>
<input type="password" value="doctor123">
</div>
</div>

<div class="actions">
<button>Add Doctor</button>
</div>
</div>
</main>
</body>
</html>
