<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Portal - Smart Clinic</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937}
header{background:#2563eb;color:white;padding:22px 40px;font-size:22px;font-weight:bold}
main{max-width:1100px;margin:45px auto;padding:0 25px}
.panel{background:white;padding:30px;border-radius:14px;box-shadow:0 5px 20px rgba(0,0,0,.08)}
h1{margin-top:0}
.doctor{color:#6b7280;margin-bottom:30px}
table{width:100%;border-collapse:collapse}
th{text-align:left;background:#f3f4f6;padding:14px}
td{padding:16px 14px;border-bottom:1px solid #e5e7eb}
.status{background:#dcfce7;color:#166534;padding:6px 10px;border-radius:15px;font-size:13px}
</style>
</head>
<body>
<header>Smart Clinic Management System — Doctor Portal</header>
<main>
<div class="panel">
<h1>My Patient Appointments</h1>
<p class="doctor"><strong>Doctor:</strong> Dr Sarah Lim — Cardiology</p>

<table>
<thead>
<tr>
<th>Patient</th>
<th>Date</th>
<th>Time</th>
<th>Status</th>
</tr>
</thead>
<tbody>
<tr>
<td>Alice Tan</td>
<td>15 Sep 2026</td>
<td>9:00 AM</td>
<td><span class="status">Scheduled</span></td>
</tr>
<tr>
<td>Benjamin Lee</td>
<td>15 Sep 2026</td>
<td>10:00 AM</td>
<td><span class="status">Scheduled</span></td>
</tr>
<tr>
<td>Chloe Lim</td>
<td>15 Sep 2026</td>
<td>11:00 AM</td>
<td><span class="status">Scheduled</span></td>
</tr>
</tbody>
</table>
</div>
</main>
</body>
</html>
