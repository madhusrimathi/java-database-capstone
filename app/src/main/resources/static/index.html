cat > app/src/main/resources/static/index.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Clinic Management System</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }
        header {
            background: #2563eb;
            color: white;
            padding: 22px 40px;
            font-size: 22px;
            font-weight: bold;
        }
        main {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            width: 650px;
            padding: 45px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,.10);
            text-align: center;
        }
        h1 { margin-top: 0; }
        .subtitle { color: #6b7280; margin-bottom: 35px; }
        .roles {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        button {
            border: 0;
            border-radius: 8px;
            padding: 14px 25px;
            font-size: 16px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }
        button:hover { background: #1d4ed8; }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            align-items: center;
            justify-content: center;
        }
        .login-box {
            width: 400px;
            background: white;
            border-radius: 14px;
            padding: 35px;
            position: relative;
            text-align: left;
        }
        .login-box h2 { text-align: center; margin-top: 0; }
        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }
        .login-button {
            width: 100%;
            margin-top: 25px;
        }
        .close {
            position: absolute;
            right: 18px;
            top: 12px;
            font-size: 26px;
            cursor: pointer;
            color: #6b7280;
        }
    </style>
</head>
<body>

<header>Smart Clinic Management System</header>

<main>
    <div class="card">
        <h1>Welcome to Smart Clinic</h1>
        <p class="subtitle">Select your role to access the clinic management portal.</p>

        <div class="roles">
            <button onclick="openLogin('Admin')">Admin</button>
            <button onclick="openLogin('Doctor')">Doctor</button>
            <button onclick="openLogin('Patient')">Patient</button>
        </div>
    </div>
</main>

<div class="modal" id="loginModal">
    <div class="login-box">
        <span class="close" onclick="closeLogin()">&times;</span>
        <h2 id="loginTitle">Login</h2>

        <form onsubmit="return false;">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter your email">

            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password">

            <button class="login-button" type="submit">Login</button>
        </form>
    </div>
</div>

<script>
function openLogin(role) {
    document.getElementById('loginTitle').textContent = role + ' Login';
    document.getElementById('loginModal').style.display = 'flex';
}

function closeLogin() {
    document.getElementById('loginModal').style.display = 'none';
}
</script>

</body>
</html>
EOF

cp app/src/main/resources/static/index.html docs/index.html
